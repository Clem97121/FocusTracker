name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build FocusTracker.sln -c Release

      - name: Test
        run: dotnet test FocusTracker.Tests -c Release --no-build

  # Застосунок для телефону: лише перевірка, що збирається (без підпису)
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        shell: pwsh
        run: |
          dotnet build FocusTracker.Mobile/FocusTracker.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
          dotnet build FocusTracker.Mobile/FocusTracker.Mobile.csproj -f net10.0-android -c Release "-p:AndroidSdkDirectory=$env:ANDROID_HOME" -p:AndroidPackageFormats=apk
