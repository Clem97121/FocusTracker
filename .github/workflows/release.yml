name: release

# Реліз за тегом vX.Y.Z: збірка, пакування Velopack і публікація в GitHub Releases.
# Встановлені копії знаходять нову версію там і оновлюються самі.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test FocusTracker.Tests -c Release

      - name: Publish
        shell: pwsh
        run: dotnet publish FocusTracker.App/FocusTracker.App.csproj -c Release -r win-x64 --self-contained false -o publish -p:Version=$env:VERSION

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.158

      # Попередній реліз потрібен для дельта-оновлень; для першого релізу його немає
      - name: Download previous release
        continue-on-error: true
        shell: pwsh
        run: vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN

      - name: Pack
        shell: pwsh
        run: >
          vpk pack
          --packId FocusTrackerApp
          --packVersion $env:VERSION
          --packDir publish
          --mainExe FocusTracker.App.exe
          --packTitle FocusTracker
          --icon FocusTracker.App/icon.ico
          --framework net8.0-x64-desktop

      - name: Upload
        shell: pwsh
        run: vpk upload github --repoUrl $env:REPO_URL --publish --releaseName "FocusTracker $env:VERSION" --tag $env:TAG --token $env:GH_TOKEN

  # APK для телефону — у той самий реліз; застосунок на телефоні знаходить його й оновлюється.
  # Збирається паралельно з ПК; .NET з Android-інструментами береться з кешу (див. android.yml).
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      DOTNET_INSTALL_DIR: /home/runner/.dotnet-maui
      DOTNET_SDK_VERSION: 10.0.401
    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK with MAUI Android
        id: dotnet-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.dotnet-maui
          key: dotnet-${{ env.DOTNET_SDK_VERSION }}-maui-android-linux-v1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-mobile-${{ hashFiles('FocusTracker.Mobile/FocusTracker.Mobile.csproj') }}

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        if: steps.dotnet-cache.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      - name: Android SDK
        run: dotnet build FocusTracker.Mobile/FocusTracker.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android "-p:AndroidSdkDirectory=$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Publish APK
        shell: pwsh
        run: |
          # Конфігурація Firebase для push: csproj шукає її поруч із клоном
          if ($env:GOOGLE_SERVICES_JSON) { Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE '../google-services.json') -Value $env:GOOGLE_SERVICES_JSON -NoNewline }
          $version = $env:TAG.TrimStart('v')
          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          # versionCode Android має зростати з кожною версією: 1.0.12 → 10012
          $code = $parts[0] * 10000 + $parts[1] * 100 + $parts[2]
          $keystore = Join-Path $env:RUNNER_TEMP 'focustracker.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          dotnet publish FocusTracker.Mobile/FocusTracker.Mobile.csproj -f net10.0-android -c Release -o out/android `
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME" `
            -p:AndroidPackageFormats=apk `
            -p:AndroidKeyStore=true `
            "-p:AndroidSigningKeyStore=$keystore" `
            -p:AndroidSigningKeyAlias=focustracker `
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD `
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD `
            "-p:ApplicationDisplayVersion=$version" `
            "-p:ApplicationVersion=$code"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $apk = Get-ChildItem out/android -Filter '*-Signed.apk' | Select-Object -First 1
          Copy-Item $apk.FullName out/FocusTracker-android.apk

      # Реліз створює job release (vpk); якщо APK готовий раніше, чекаємо на нього
      - name: Upload APK
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "$TAG" out/FocusTracker-android.apk --clobber